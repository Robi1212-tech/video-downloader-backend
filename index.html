<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Universal Video Downloader</title>
    <script src="https://tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-white min-h-screen flex flex-col items-center justify-center p-4">
    <div class="w-full max-w-xl text-center">
        <h1 class="text-3xl font-extrabold mb-2 text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 to-blue-500">AnyVideo Downloader</h1>
        <p class="text-slate-400 text-sm mb-6">Download high-quality videos from TikTok, Instagram, and hundreds more.</p>
        
        <div class="bg-slate-800 p-3 rounded-xl shadow-xl flex flex-col gap-2">
            <input type="text" id="videoUrl" placeholder="Paste your video link here..." class="bg-slate-700 text-white px-4 py-3 rounded-lg focus:outline-none text-sm" />
            <button onclick="fetchVideo()" id="btnText" class="bg-blue-600 hover:bg-blue-700 font-semibold py-3 rounded-lg transition-all text-sm">Fetch Video</button>
        </div>

        <div id="errorBox" class="hidden mt-4 bg-red-500/20 border border-red-500 text-red-300 p-4 rounded-xl text-left text-sm"></div>

        <div id="resultCard" class="hidden mt-6 bg-slate-800 p-4 rounded-xl shadow-xl text-left flex flex-col gap-4">
            <img id="vidThumb" src="" alt="Thumbnail" class="w-full h-40 object-cover rounded-lg bg-slate-700" />
            <div>
                <span id="vidSource" class="bg-blue-500/20 text-blue-400 text-xs px-2 py-0.5 rounded-full font-medium uppercase">Platform</span>
                <h3 id="vidTitle" class="text-base font-bold mt-2 text-slate-100 line-clamp-2">Title</h3>
                <p id="vidDuration" class="text-xs text-slate-400 mt-1">Duration: --</p>
                <a id="downloadBtn" href="" target="_blank" rel="noopener noreferrer" download="video.mp4" class="mt-4 text-center bg-emerald-600 hover:bg-emerald-700 font-semibold py-2.5 rounded-lg block text-sm">Download Video File</a>
            </div>
        </div>
    </div>

    <script>
        async function fetchVideo() {
            const videoUrl = document.getElementById('videoUrl').value.trim();
            const btnText = document.getElementById('btnText');
            const resultCard = document.getElementById('resultCard');
            const errorBox = document.getElementById('errorBox');
            if (!videoUrl) return alert('Please paste a link first!');

            btnText.innerText = 'Processing...';
            btnText.disabled = true;
            errorBox.classList.add('hidden');
            resultCard.classList.add('hidden');

            try {
                // Connected to your live Render API server link safely
                const response = await fetch('https://onrender.com', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ videoUrl })
                });
                const data = await response.json();
                if (!response.ok) throw new Error(data.error || 'Something went wrong.');

                document.getElementById('vidThumb').src = data.thumbnail || 'https://unsplash.com';
                document.getElementById('vidTitle').innerText = data.title;
                document.getElementById('vidSource').innerText = data.source;
                document.getElementById('vidDuration').innerText = `Duration: ${data.duration}`;
                document.getElementById('downloadBtn').href = data.downloadUrl;
                resultCard.classList.remove('hidden');
            } catch (err) {
                errorBox.innerText = err.message;
                errorBox.classList.remove('hidden');
            } finally {
                btnText.innerText = 'Fetch Video';
                btnText.disabled = false;
            }
        }
    </script>
</body>
</html>
